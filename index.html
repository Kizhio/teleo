
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FF6B35">
<meta name="format-detection" content="telephone=no">
<title>Aprende a Leer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --naranja:#FF6B35;--naranja-l:#FF8F5E;--amarillo:#FFD166;--verde:#06D6A0;--verde-d:#05B384;
  --azul:#118AB2;--azul-l:#4ECDC4;--rosa:#EF476F;--rosa-l:#FF7096;--morado:#7B2D8E;
  --fondo:#FFF8F0;--card:#FFFFFF;--txt:#2D3436;
  --sh:0 4px 15px rgba(0,0,0,0.1);--sh2:0 8px 25px rgba(0,0,0,0.15);--rad:18px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,'Helvetica Neue',sans-serif;background-color:var(--fondo);
  background-image:radial-gradient(circle at 10% 20%,rgba(255,209,102,.12) 0%,transparent 50%),radial-gradient(circle at 90% 80%,rgba(6,214,160,.08) 0%,transparent 50%);
  color:var(--txt);min-height:100%;overflow-x:hidden;-webkit-tap-highlight-color:rgba(0,0,0,0);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap');
body.fl,body.fl *{font-family:'Nunito',sans-serif}

.hdr{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:12px 16px;padding-top:calc(12px + var(--safe-top));gap:10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.06);position:-webkit-sticky;position:sticky;top:0;z-index:100}
.hdr h2{font-family:'Fredoka One',cursive;font-size:1.15rem;-webkit-flex:1;flex:1}
.btn-b{width:42px;height:42px;border-radius:12px;border:none;background:var(--fondo);font-size:20px;cursor:pointer;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-appearance:none;appearance:none;touch-action:manipulation;-webkit-transition:all .2s;transition:all .2s}
.btn-b:active{background:#ddd;-webkit-transform:scale(.95);transform:scale(.95)}
.stars-d{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:4px;font-weight:800;font-size:1rem;color:var(--amarillo)}
.gc{padding:16px;max-width:520px;margin:0 auto;-webkit-animation:fadeIn .35s ease;animation:fadeIn .35s ease;padding-bottom:calc(16px + var(--safe-bottom))}

/* SPLASH */
.splash{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px;padding-top:calc(24px + var(--safe-top));text-align:center;-webkit-animation:fadeIn .5s;animation:fadeIn .5s}
.splash-em{font-size:72px;-webkit-animation:bounce 2s infinite;animation:bounce 2s infinite;margin-bottom:6px}
.splash h1{font-family:'Fredoka One',cursive;font-size:2.2rem;background:-webkit-linear-gradient(135deg,var(--naranja),var(--rosa),var(--morado));background:linear-gradient(135deg,var(--naranja),var(--rosa),var(--morado));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.splash>p{font-size:1rem;color:#888;margin-bottom:6px;font-weight:700}
.sp-banner{background:-webkit-linear-gradient(135deg,var(--amarillo),#FFB347);background:linear-gradient(135deg,var(--amarillo),#FFB347);border-radius:16px;padding:14px 18px;margin-bottom:18px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(255,179,71,.3)}
.sp-banner .sp-icon{font-size:36px}.sp-banner .sp-info{-webkit-flex:1;flex:1;text-align:left}
.sp-banner .sp-info h4{font-family:'Fredoka One',cursive;font-size:.95rem;color:#7a4a00}
.sp-banner .sp-info p{font-size:.75rem;color:#9a6a20;font-weight:700}
.sp-streak{font-family:'Fredoka One',cursive;font-size:1.6rem;color:#7a4a00}

.menu-g{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:420px;width:100%}
.menu-g.three-col{grid-template-columns:repeat(3,1fr)}
.mc{background:var(--card);border-radius:var(--rad);padding:20px 12px;box-shadow:var(--sh);cursor:pointer;-webkit-transition:all .2s;transition:all .2s;border:3px solid transparent;position:relative;overflow:hidden;text-align:center;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.mc::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;border-radius:var(--rad) var(--rad) 0 0}
.mc:nth-child(1)::before{background:var(--naranja)}.mc:nth-child(2)::before{background:var(--verde)}.mc:nth-child(3)::before{background:var(--azul)}.mc:nth-child(4)::before{background:var(--rosa)}.mc:nth-child(5)::before{background:var(--morado)}
.mc:active{-webkit-transform:scale(.97);transform:scale(.97)}
.mc .em{font-size:32px;margin-bottom:4px}.mc h3{font-family:'Fredoka One',cursive;font-size:.9rem;margin-bottom:2px}.mc p{font-size:.65rem;color:#aaa;font-weight:600}
.mc .check-done{position:absolute;top:6px;right:6px;font-size:16px}

.case-btn{padding:6px 14px;border-radius:10px;border:2px solid #ddd;background:#fff;font-family:'Fredoka One',cursive;font-size:.8rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.case-btn.active{background:var(--azul);color:#fff;border-color:var(--azul)}

/* LETTER SELECTOR */
.letter-sel{background:#fff;border-radius:var(--rad);padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.letter-sel h4{font-family:'Fredoka One',cursive;font-size:.9rem;margin-bottom:8px;color:var(--azul)}
.letter-grid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:6px;-webkit-justify-content:center;justify-content:center}
.let-btn{width:40px;height:40px;border-radius:10px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.let-btn.active{background:var(--naranja);color:#fff;border-color:var(--naranja);-webkit-transform:scale(1.08);transform:scale(1.08)}

/* SYLLABLE */
.syl-disp{background:#fff;border-radius:22px;padding:24px;text-align:center;box-shadow:var(--sh);margin-bottom:16px;position:relative;overflow:hidden}
.syl-big{font-family:'Fredoka One',cursive;font-size:5rem;letter-spacing:3px;line-height:1.2;cursor:pointer;position:relative;z-index:1;-webkit-transition:all .2s;transition:all .2s}
.syl-big:active{-webkit-transform:scale(1.1);transform:scale(1.1)}
.c1{color:var(--naranja)}.c2{color:var(--verde)}.c3{color:var(--azul)}.c4{color:var(--rosa)}.c5{color:var(--morado)}
.syl-hint{font-size:.85rem;color:#aaa;margin-top:6px;font-weight:700;position:relative;z-index:1}
.syl-ex{margin-top:12px;padding:10px 16px;background:var(--fondo);border-radius:12px;font-size:1.15rem;font-weight:700;position:relative;z-index:1}
.syl-ex .hl{color:var(--naranja);font-family:'Fredoka One',cursive}
.syl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.sg-btn{padding:14px 6px;border-radius:12px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.05);-webkit-appearance:none;appearance:none;touch-action:manipulation}
.sg-btn:active{-webkit-transform:scale(.95);transform:scale(.95)}.sg-btn.active{background:var(--naranja);color:#fff;border-color:var(--naranja)}
.syl-nav{display:-webkit-flex;display:flex;gap:8px;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:14px}
.sgr-btn{padding:10px 14px;border-radius:50px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:.85rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.sgr-btn.active{background:var(--naranja);color:#fff;border-color:var(--naranja);-webkit-transform:scale(1.05);transform:scale(1.05)}

/* WORD */
.wch{background:#fff;border-radius:22px;padding:20px;text-align:center;box-shadow:var(--sh);margin-bottom:16px}
.w-img{font-size:56px;margin-bottom:4px;-webkit-animation:bounce 3s infinite;animation:bounce 3s infinite}
.w-label{font-size:.85rem;color:#aaa;font-weight:700;margin-bottom:10px}
.w-slots{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;gap:6px;margin-bottom:16px;min-height:50px;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.w-slot{min-width:50px;height:48px;border-radius:12px;border:3px dashed #ddd;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:1.2rem;background:var(--fondo);-webkit-transition:all .3s;transition:all .3s}
.w-slot.filled{border-style:solid;border-color:var(--verde);background:#E8FFF5;color:var(--verde-d);-webkit-animation:popIn .3s;animation:popIn .3s}
.w-slot.wrong{border-color:var(--rosa);background:#FFE8EE;-webkit-animation:shake .4s;animation:shake .4s}
.syl-opts{display:-webkit-flex;display:flex;gap:8px;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.so{padding:12px 18px;border-radius:12px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:1.1rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.05);-webkit-appearance:none;appearance:none;touch-action:manipulation}
.so:active{-webkit-transform:scale(.93);transform:scale(.93)}.so.used{opacity:.25;pointer-events:none;-webkit-transform:scale(.9);transform:scale(.9)}

/* PHRASES */
.ph-imgs{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;gap:6px;font-size:42px;margin-bottom:10px}
.ph-prompt{font-size:.85rem;color:#aaa;font-weight:700;margin-bottom:10px}
.ph-area{background:#fff;border-radius:18px;padding:14px;min-height:52px;box-shadow:var(--sh);margin-bottom:14px;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:6px;-webkit-justify-content:center;justify-content:center;-webkit-align-items:center;align-items:center;border:3px dashed #eee;-webkit-transition:all .3s;transition:all .3s}
.ph-area.has{border-style:solid;border-color:var(--azul-l)}
.ph-w{padding:8px 14px;border-radius:10px;font-family:'Fredoka One',cursive;font-size:1rem;background:var(--azul);color:#fff;cursor:pointer;-webkit-animation:popIn .3s;animation:popIn .3s;touch-action:manipulation}
.ph-w:active{background:var(--rosa);-webkit-transform:scale(.95);transform:scale(.95)}
.wb{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;-webkit-justify-content:center;justify-content:center;margin-bottom:14px}
.bw{padding:10px 16px;border-radius:10px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;box-shadow:0 2px 6px rgba(0,0,0,.05);-webkit-appearance:none;appearance:none;touch-action:manipulation}
.bw:active{-webkit-transform:scale(.95);transform:scale(.95)}.bw.used{opacity:.2;pointer-events:none;-webkit-transform:scale(.9);transform:scale(.9)}

/* READING */
.rd-card{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh);margin-bottom:14px;text-align:center}
.rd-em{font-size:48px;margin-bottom:6px}.rd-title{font-family:'Fredoka One',cursive;font-size:1.15rem;margin-bottom:12px;color:var(--naranja)}
.rd-text{font-family:'Fredoka One',cursive;font-size:1.3rem;line-height:1.8;margin-bottom:10px}
.wh{display:inline;padding:2px 4px;border-radius:5px;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;touch-action:manipulation}
.wh:active{background:var(--amarillo)}.wh.aw{background:var(--amarillo);-webkit-animation:pulse .5s;animation:pulse .5s}
.quiz-box{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px;text-align:center}
.quiz-q{font-family:'Fredoka One',cursive;font-size:1rem;margin-bottom:12px;color:var(--morado)}
.quiz-opts{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:8px}
.quiz-o{padding:12px 14px;border-radius:12px;border:2px solid #eee;background:#fff;font-size:1rem;font-weight:700;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;text-align:left;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.quiz-o.correct{background:var(--verde);color:#fff;border-color:var(--verde)}.quiz-o.wrong{background:var(--rosa);color:#fff;border-color:var(--rosa)}
.mw-text{font-family:'Fredoka One',cursive;font-size:1.2rem;line-height:1.8;margin-bottom:14px}
.mw-blank{display:inline-block;min-width:60px;border-bottom:3px dashed var(--naranja);text-align:center;color:var(--naranja);margin:0 4px}
.mw-opts{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;gap:8px;-webkit-justify-content:center;justify-content:center}
.mw-o{padding:10px 18px;border-radius:12px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:1rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.mw-o:active{-webkit-transform:scale(.95);transform:scale(.95)}
.mw-o.correct{background:var(--verde);color:#fff;border-color:var(--verde)}.mw-o.wrong{background:var(--rosa);color:#fff;border-color:var(--rosa);-webkit-animation:shake .4s;animation:shake .4s}

/* TRACING */
.trace-card{background:#fff;border-radius:22px;padding:20px;box-shadow:var(--sh);margin-bottom:14px;text-align:center}
.trace-letter-big{font-family:'Fredoka One',cursive;font-size:1.8rem;color:var(--morado);margin-bottom:6px}
.trace-canvas-wrap{position:relative;width:300px;height:300px;margin:0 auto 12px;border-radius:12px;overflow:hidden;border:3px solid #ccc;background:#fffef8}
.trace-canvas-wrap canvas{position:absolute;top:0;left:0;touch-action:none}
.trace-guide{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;gap:6px;margin-bottom:10px;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.trace-g-btn{width:44px;height:44px;border-radius:12px;border:2px solid #eee;background:#fff;font-size:1.3rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;-webkit-appearance:none;appearance:none;touch-action:manipulation;font-family:'Fredoka One',cursive}
.trace-g-btn.active{background:var(--morado);color:#fff;border-color:var(--morado)}
.trace-g-btn.done{background:var(--verde);color:#fff;border-color:var(--verde)}
.trace-score{font-family:'Fredoka One',cursive;font-size:.9rem;color:var(--verde-d);margin-top:6px}

/* VOICE SELECTOR */
.voice-sel{background:#fff;border-radius:var(--rad);padding:14px;box-shadow:var(--sh);margin-bottom:14px}
.voice-sel h4{font-family:'Fredoka One',cursive;font-size:.9rem;margin-bottom:8px;color:var(--morado)}
.voice-list{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.voice-item{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:2px solid #eee;background:#fff;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;touch-action:manipulation}
.voice-item.active{border-color:var(--morado);background:#f3e8ff}
.voice-item .v-name{-webkit-flex:1;flex:1;font-weight:700;font-size:.85rem}
.voice-item .v-test{padding:4px 10px;border-radius:8px;background:var(--morado);color:#fff;font-size:.7rem;font-weight:700;border:none;cursor:pointer;-webkit-appearance:none;appearance:none;touch-action:manipulation}

/* BUTTONS */
.ba{display:-webkit-inline-flex;display:inline-flex;-webkit-align-items:center;align-items:center;gap:6px;padding:12px 20px;border-radius:50px;border:none;font-family:'Fredoka One',cursive;font-size:.95rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;box-shadow:0 4px 15px rgba(0,0,0,.13);color:#fff;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.ba:active{-webkit-transform:scale(.95);transform:scale(.95)}
.bg{background:var(--verde)}.bb{background:var(--azul)}.bo{background:var(--naranja)}.bp{background:var(--rosa)}.bm{background:var(--morado)}
.br{display:-webkit-flex;display:flex;gap:10px;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-top:12px}
.pb-c{background:#eee;border-radius:50px;height:10px;margin:10px 0;overflow:hidden}
.pb-f{height:100%;border-radius:50px;background:-webkit-linear-gradient(left,var(--verde),var(--azul-l));background:linear-gradient(90deg,var(--verde),var(--azul-l));-webkit-transition:width .5s;transition:width .5s}

.fb-ov{position:fixed;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:1000;background:rgba(0,0,0,.4);-webkit-animation:fadeIn .2s;animation:fadeIn .2s}
.fb-card{background:#fff;border-radius:24px;padding:30px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);-webkit-animation:popIn .4s;animation:popIn .4s;max-width:310px;width:90%}
.fb-em{font-size:56px;margin-bottom:6px}.fb-card h3{font-family:'Fredoka One',cursive;font-size:1.3rem;margin-bottom:4px}.fb-card p{color:#888;font-weight:600;margin-bottom:14px;font-size:.85rem}
.sp-modal{background:-webkit-linear-gradient(135deg,#FFD166,#FF6B35);background:linear-gradient(135deg,#FFD166,#FF6B35);border-radius:24px;padding:30px;text-align:center;box-shadow:0 20px 60px rgba(255,107,53,.4);-webkit-animation:popIn .5s;animation:popIn .5s;max-width:320px;width:90%}
.sp-modal h2{font-family:'Fredoka One',cursive;font-size:1.7rem;color:#fff;margin-bottom:4px}.sp-modal p{color:rgba(255,255,255,.85);font-weight:700;margin-bottom:14px}
.sp-modal .sp-big-em{font-size:70px;margin-bottom:8px;-webkit-animation:bounce 1s infinite;animation:bounce 1s infinite}
.conf{position:fixed;width:10px;height:10px;border-radius:2px;z-index:2000;pointer-events:none;-webkit-animation:confFall 2s forwards;animation:confFall 2s forwards}

.tabs{display:-webkit-flex;display:flex;gap:6px;margin-bottom:12px;-webkit-justify-content:center;justify-content:center}
.tab{padding:8px 14px;border-radius:50px;border:2px solid #eee;background:#fff;font-family:'Fredoka One',cursive;font-size:.75rem;cursor:pointer;-webkit-transition:all .2s;transition:all .2s;-webkit-appearance:none;appearance:none;touch-action:manipulation}
.tab.active{background:var(--morado);color:#fff;border-color:var(--morado)}

@-webkit-keyframes fadeIn{from{opacity:0;-webkit-transform:translateY(8px)}to{opacity:1;-webkit-transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@-webkit-keyframes popIn{from{opacity:0;-webkit-transform:scale(.5)}to{opacity:1;-webkit-transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
@-webkit-keyframes bounce{0%,100%{-webkit-transform:translateY(0)}50%{-webkit-transform:translateY(-8px)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@-webkit-keyframes shake{0%,100%{-webkit-transform:translateX(0)}25%{-webkit-transform:translateX(-6px)}75%{-webkit-transform:translateX(6px)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@-webkit-keyframes pulse{0%,100%{-webkit-transform:scale(1)}50%{-webkit-transform:scale(1.12)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@-webkit-keyframes confFall{0%{opacity:1;-webkit-transform:translateY(0) rotate(0)}100%{opacity:0;-webkit-transform:translateY(100vh) rotate(720deg)}}
@keyframes confFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}

@media(max-width:380px){.syl-grid{grid-template-columns:repeat(4,1fr);gap:6px}.sg-btn{padding:10px 4px;font-size:.9rem}.menu-g{gap:10px}.mc{padding:16px 8px}.gc{padding:12px}.let-btn{width:34px;height:34px;font-size:.85rem}.trace-canvas-wrap{width:260px;height:260px}.trace-g-btn{width:36px;height:36px;font-size:1rem}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

// ============ PHRASE FORMATTING ============
function fmtPhrase(words,idx,total){
  // First word capitalized, last word with period
  var w=words;
  if(idx===0)w=w.charAt(0).toUpperCase()+w.slice(1);
  if(idx===total-1)w=w+'.';
  return w;
}
function fmtPhraseWord(word,idx,total){
  var w=cas(word);
  if(idx===0)w=w.charAt(0).toUpperCase()+w.slice(1);
  if(idx===total-1)w=w+'.';
  return w;
}

h+='<div class="trace-guide">';for(var i=0;i<letters.length;i++){var l=letters[i];var done=S.traceDone.indexOf(l)>=0;h+='<button class="trace-g-btn '+(S.traceLetter===l?'active':'')+(done?' done':'')+'" onclick="setTL(\''+esc(l)+'\')">'+cas(l)+'</button>'}h+='</div>';

// Use the real calligraphy image as background
var imgSrc=LETTER_IMGS[S.traceLetter]||'';
h+='<div class="trace-canvas-wrap">';
if(imgSrc) h+='<img src="'+imgSrc+'" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;opacity:0.35;pointer-events:none" />';
h+='<canvas id="traceC" width="300" height="300"></canvas></div>';

function initTrace(){
  var drawC=document.getElementById('traceC');
  if(!drawC)return;
  var dx=drawC.getContext('2d');
  var W=drawC.width;var H=drawC.height;
  dx.clearRect(0,0,W,H);
  var drawing=false;
  function getPos(e){
    var rect=drawC.getBoundingClientRect();
    var scaleX=W/rect.width;var scaleY=H/rect.height;
    if(e.touches){return{x:(e.touches[0].clientX-rect.left)*scaleX,y:(e.touches[0].clientY-rect.top)*scaleY}}
    return{x:(e.clientX-rect.left)*scaleX,y:(e.clientY-rect.top)*scaleY}
  }
  function startDraw(e){e.preventDefault();drawing=true;var p=getPos(e);dx.beginPath();dx.moveTo(p.x,p.y);dx.strokeStyle='#cc2244';dx.lineWidth=5;dx.lineCap='round';dx.lineJoin='round'}
  function moveDraw(e){if(!drawing)return;e.preventDefault();var p=getPos(e);dx.lineTo(p.x,p.y);dx.stroke()}
  function endDraw(){if(drawing){drawing=false}}
  drawC.addEventListener('mousedown',startDraw,{passive:false});
  drawC.addEventListener('mousemove',moveDraw,{passive:false});
  drawC.addEventListener('mouseup',endDraw);
  drawC.addEventListener('mouseleave',endDraw);
  drawC.addEventListener('touchstart',startDraw,{passive:false});
  drawC.addEventListener('touchmove',moveDraw,{passive:false});
  drawC.addEventListener('touchend',endDraw);
  drawC.addEventListener('touchcancel',endDraw);
}
